<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#05080d">
<link rel="icon" href="/static/logo.png">
<title>Sign in · Nexus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="/static/js/tailwind.config.js"></script>
<link rel="stylesheet" href="/static/css/theme.css">
</head>
<body class="h-dvh-fallback flex font-body text-ink-1 text-sm">

<div class="w-full overflow-y-auto scroll-thin flex items-start justify-center px-0" style="padding-top:max(44px,calc(env(safe-area-inset-top,0px) + 24px));padding-bottom:max(44px,calc(env(safe-area-inset-bottom,0px) + 24px))">
  <div class="w-full max-w-[400px] px-7 m-auto anim-rise">

    <!-- Logo -->
    <div class="flex items-center gap-3 mb-9">
      <img src="/static/logo.png" alt="Nexus" class="w-14 h-14 object-contain shrink-0 drop-shadow-[0_0_22px_rgba(255,184,0,.45)] spark-pulse">
      <div>
        <span class="font-display text-lg font-bold tracking-[.18em] text-gradient">NEXUS</span>
        <div class="text-[10px] text-ink-3 font-display font-medium tracking-wide mt-0.5">by <a href="https://www.linkedin.com/in/aarushsrivatsa/" target="_blank" rel="noopener" class="hover:text-accent transition-colors">Aarush Srivatsa</a></div>
      </div>
    </div>

    <h1 class="font-display text-2xl font-semibold tracking-tight mb-1.5">Welcome back</h1>
    <p class="text-[13px] text-ink-3 mb-7 leading-relaxed">Sign in to continue to your conversations</p>

    <form id="login-form" novalidate>
      <div class="mb-3.5">
        <label for="l-email" class="block font-display text-[10px] font-bold tracking-wider uppercase text-ink-3 mb-1.5">Email</label>
        <input type="email" id="l-email" placeholder="you@example.com" autocomplete="email" inputmode="email"
          class="w-full px-4 py-3 bg-surface-1 border border-line-1 rounded-xl text-base text-ink-1 outline-none transition-[border-color,box-shadow] focus:border-accent/70 focus:ring-4 focus:ring-accent/10 placeholder:text-ink-3">
      </div>
      <div class="mb-3.5">
        <label for="l-pass" class="block font-display text-[10px] font-bold tracking-wider uppercase text-ink-3 mb-1.5">Password</label>
        <div class="relative">
          <input type="password" id="l-pass" placeholder="••••••••" autocomplete="current-password"
            class="w-full px-4 py-3 pr-12 bg-surface-1 border border-line-1 rounded-xl text-base text-ink-1 outline-none transition-[border-color,box-shadow] focus:border-accent/70 focus:ring-4 focus:ring-accent/10 placeholder:text-ink-3">
          <button type="button" onclick="Nexus.togglePw('l-pass',this)" aria-label="Show password"
            class="absolute right-3 top-1/2 -translate-y-1/2 p-1.5 text-ink-3 hover:text-ink-2 transition-colors">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>
      <div class="text-right mb-1">
        <a href="/reset-password" class="text-[11.5px] text-ink-3 hover:text-accent transition-colors font-medium">Forgot password?</a>
      </div>
      <button type="submit" class="w-full mt-2 py-3.5 bg-gradient-to-br from-accent to-accent2 rounded-xl font-display text-[13px] font-bold text-black tracking-wide shadow-[0_4px_24px_rgba(255,184,0,.18)] transition-all hover:opacity-90 hover:shadow-[0_6px_32px_rgba(255,184,0,.3)] active:scale-[.97] disabled:opacity-40 disabled:cursor-not-allowed min-h-[48px]">
        Sign in →
      </button>
      <div class="text-xs text-danger mt-2.5 min-h-[18px] font-medium leading-relaxed" id="l-err" role="alert" aria-live="assertive"></div>
    </form>

    <p class="text-center text-[13px] text-ink-3 mt-7">
      Don't have an account? <a href="/signup" class="text-accent font-semibold hover:text-white transition-colors">Create one →</a>
    </p>
  </div>
</div>

<script src="/static/js/common.js"></script>
<script src="/static/js/login.js"></script>
</body>
</html>
