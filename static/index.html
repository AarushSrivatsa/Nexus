<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#05080d">
<link rel="icon" href="/static/logo.png">
<title>Nexus</title>
<style>
  html,body{height:100%;margin:0;background:#05080d;display:flex;align-items:center;justify-content:center;}
  .mark{width:56px;height:56px;display:flex;align-items:center;justify-content:center;animation:pulse 1.6s ease-in-out infinite;filter:drop-shadow(0 0 20px rgba(255,184,0,.5));}
  .mark img{width:100%;height:100%;object-fit:contain;}
  @keyframes pulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.7;transform:scale(.94)}}
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"><img src="/static/logo.png" alt=""></div>
  <script>
    // Client-side only: server can't know auth state (tokens live in localStorage).
    window.location.replace(localStorage.getItem('at') ? '/app' : '/login');
  </script>
</body>
</html>
