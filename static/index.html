<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#05080d">
    <title>Nexus</title>
    <style>
        html,
        body {
            height: 100%;
            margin: 0;
            background: #05080d;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mark {
            width: 44px;
            height: 44px;
            border-radius: 13px;
            background: linear-gradient(135deg, #00e5ff, #0066ff);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: pulse 1.6s ease-in-out infinite;
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
                transform: scale(1)
            }

            50% {
                opacity: .7;
                transform: scale(.94)
            }
        }
    </style>
</head>

<body>
    <div class="mark" aria-hidden="true">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
            <circle cx="12" cy="12" r="3" fill="#000" />
        </svg>
    </div>
    <script>
        // Client-side only: server can't know auth state (tokens live in localStorage).
        window.location.replace(localStorage.getItem('at') ? '/app' : '/login');
    </script>
</body>

</html>
